<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111916" />
    <title>Three Bearings</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a id="skip-link" class="skip-link" href="#story-title">Skip to the journey</a>
    <main id="experience" class="experience" data-phase="arrival" data-act="1" data-history="none" data-preview="none">
      <figure id="world-shell" class="world" data-testid="world-shell" data-world-id="wayfinder-continuous-journey" aria-labelledby="scene-caption">
        <svg class="landscape" viewBox="0 0 1440 900" role="img" aria-labelledby="scene-title scene-description" preserveAspectRatio="xMidYMid slice">
          <title id="scene-title">Three Bearings landscape</title>
          <desc id="scene-description">A continuous dusk landscape whose route and landmarks remember three bearings.</desc>
          <rect class="sky" width="1440" height="900" />
          <circle class="sun" cx="900" cy="170" r="78" />
          <path class="haze" d="M0 330 C280 270 460 345 720 290 C980 240 1200 320 1440 265 L1440 550 L0 550 Z" />
          <path class="far-line" d="M0 470 L190 370 L370 430 L555 325 L740 430 L930 335 L1120 425 L1290 330 L1440 410 L1440 900 L0 900 Z" />
          <path class="ridge ridge-left" d="M0 580 L145 480 L285 305 L405 405 L560 585 L0 780 Z" />
          <path class="ridge ridge-right" d="M1440 570 L1300 470 L1180 330 L1065 410 L885 585 L1440 785 Z" />
          <path class="ground" d="M0 585 C280 520 520 600 740 555 C990 505 1220 575 1440 520 L1440 900 L0 900 Z" />
          <path class="water" d="M-40 710 C310 650 540 760 770 690 C1020 615 1190 710 1480 630" />
          <g class="memory-routes" aria-hidden="true">
            <path class="route route-1 edge" d="M710 835 C580 760 455 660 300 490" /><path class="route route-1 wait" d="M710 835 C700 730 705 645 710 550" /><path class="route route-1 gap" d="M710 835 C760 710 800 570 835 355" />
            <path class="route route-2 edge" d="M705 700 C560 675 500 625 425 595" /><path class="route route-2 wait" d="M705 700 C780 650 855 635 930 610" /><path class="route route-2 gap" d="M705 700 C880 725 1040 670 1170 590" />
            <path class="route route-3 edge" d="M720 560 C610 500 500 455 390 420" /><path class="route route-3 wait" d="M720 560 C720 455 725 370 730 290" /><path class="route route-3 gap" d="M720 560 C850 470 980 390 1125 320" />
          </g>
          <g class="first-marker" aria-hidden="true"><path class="marker-shadow" d="M700 620 L830 655 L706 638 Z"/><path d="M680 610 L705 495 L730 610 Z"/><ellipse cx="705" cy="620" rx="38" ry="19"/></g>
          <g class="second-marker" aria-hidden="true"><path d="M925 620 l24 -55 l23 55 z"/><path d="M930 575 l18 -42 l18 42 z"/></g>
          <g class="signal" aria-hidden="true"><path d="M720 390 C675 335 720 305 710 255 C770 310 748 355 720 390Z"/></g>
          <g class="traveler" aria-hidden="true"><circle cx="710" cy="815" r="11"/><path d="M710 828 L710 862 M710 840 L688 855 M710 840 L732 855"/></g>
          <g class="wind" aria-hidden="true"><path d="M110 250 C260 220 360 255 480 220"/><path d="M900 270 C1060 225 1200 275 1340 225"/></g>
        </svg>
        <figcaption id="scene-caption" class="world-status"><span id="stage-label">Arrival</span><span aria-hidden="true">·</span><span id="environment-label">Wind across unmarked ground</span></figcaption>
        <div id="language-switch" class="language-switch" role="group" aria-label="Language"><button type="button" data-locale="zh-CN">中文</button><span aria-hidden="true">|</span><button type="button" data-locale="en">EN</button></div>
        <fieldset id="world-controls" class="world-controls" hidden>
          <legend id="world-legend" class="visually-hidden">Inspect the three bearings</legend>
          <button class="hotspot hotspot-edge" type="button" data-event="inspect_edge" aria-pressed="false"><span></span><small></small></button>
          <button class="hotspot hotspot-wait" type="button" data-event="inspect_wait" aria-pressed="false"><span></span><small></small></button>
          <button class="hotspot hotspot-gap" type="button" data-event="inspect_gap" aria-pressed="false"><span></span><small></small></button>
        </fieldset>
        <section class="story" aria-labelledby="story-title">
          <p id="story-kicker" class="kicker"></p><h1 id="story-title" tabindex="-1"></h1><p id="story-body"></p>
          <div id="tradeoff" class="tradeoff" hidden><p><span id="offer-label"></span><strong id="tradeoff-offer"></strong></p><p><span id="cost-label"></span><strong id="tradeoff-cost"></strong></p></div>
          <ol id="journey-recap" class="journey-recap" hidden></ol>
          <div class="actions">
            <button id="start-action" class="action" type="button" data-event="start"></button><button id="approach-action" class="action" type="button" data-event="reach_crossing" hidden></button>
            <button id="commit-action" class="action" type="button" data-event="commit_edge" hidden></button><button id="enact-action" class="action" type="button" data-event="enact" hidden></button>
            <button id="arrive-action" class="action" type="button" data-event="arrive" hidden></button><button id="reflect-action" class="action" type="button" data-event="reflect" hidden></button><button id="restart-action" class="action" type="button" data-event="restart" hidden></button>
          </div>
        </section>
      </figure>
    </main>
    <p id="route-announcement" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
  </body>
</html>
